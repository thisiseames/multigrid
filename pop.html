<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.youtube.com https://player.twitch.tv; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https: http: blob:; connect-src 'self' https: http: wss:; worker-src 'self' blob:; frame-src https: http:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>MULTIGRID pop-out</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; visibility: visible; }
    #pop, .pop-player { position: relative; width: 100%; height: 100%; }
    .pop-player > iframe, .pop-player > video, .pop-player > .player-fill, .pop-player > .audio-tile { display: block; width: 100%; height: 100%; border: 0; }
    .pop-player video { object-fit: contain; background: #000; }
    .pop-error { margin: 0; padding: 16px; color: #ddd; font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="pop"></div>
  <script type="module" src="src/pop.js"></script>
</body>
</html>
