# Refreshes the Reader every 30 minutes: headlines from Eames's feeds, and each new story's
# text locked with READER_KEY (a repository secret), so the public project shows only noise.
# GitHub drops many scheduled runs when it's busy, so it tries every 5 minutes and each try
# stops straight away unless the Reader is more than 25 minutes old.
name: reader

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reader
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Is the Reader fresh enough already?
        id: fresh
        run: |
          age=$(node -e "const d=require('./reader/index.json'); const t=d.updated>1e12?d.updated:d.updated*1000; console.log(Math.round((Date.now()-t)/60000))" 2>/dev/null || echo 9999)
          echo "Reader is $age minutes old."
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$age" -lt 25 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
        if: steps.fresh.outputs.skip != 'true'
      - run: node tools/build-reader.mjs
        if: steps.fresh.outputs.skip != 'true'
        env:
          READER_KEY: ${{ secrets.READER_KEY }}
      - name: Save the new headlines
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "multigrid-reader"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reader
          git diff --cached --quiet && exit 0
          git commit -m "Update Reader"
          for attempt in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
