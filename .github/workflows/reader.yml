# Refreshes the Reader every 30 minutes: headlines from Eames's feeds, and each new story's
# text locked with READER_KEY (a repository secret), so the public project shows only noise.
name: reader

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reader
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node tools/build-reader.mjs
        env:
          READER_KEY: ${{ secrets.READER_KEY }}
      - name: Save the new headlines
        run: |
          git config user.name "multigrid-reader"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reader
          git diff --cached --quiet && exit 0
          git commit -m "Update Reader"
          for attempt in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
