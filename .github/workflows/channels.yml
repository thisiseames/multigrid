# Builds live-channels.json: English-language channels from the US, Canada, Australia,
# Ireland, New Zealand and the UK that pass a real manifest + segment + CORS test.
# A channel that does not play in MULTIGRID is not added to the finder.
name: channels

on:
  schedule:
    - cron: '43 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: channels
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tools/build-channels.mjs
        continue-on-error: true
      - name: Save the working channel catalog
        run: |
          git config user.name "multigrid-channels"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-channels.json
          git diff --cached --quiet && exit 0
          git commit -m "Update working live channels"
          git pull --rebase
          git push
