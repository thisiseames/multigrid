# Refreshes flights.json once a day: the cheapest nonstop one-way fare from Toronto on
# seven routes over the next eight Saturdays. Google Flights is read without a key or account.
# If it doesn't answer, the script keeps the last good fares for 48 hours.
name: flights

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flights
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tools/build-flights.mjs
        continue-on-error: true
      - name: Save the new fares
        run: |
          git config user.name "multigrid-flights"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flights.json
          git diff --cached --quiet && exit 0
          git commit -m "Update flight deals"
          git pull --rebase
          git push
