# Refreshes guide.json (the TV guide), feeds.json (TikTok feeds), and Today's movies.json (from
# Wikipedia), charts.json (Billboard), shows.json (TVmaze premieres) and top10.json (Netflix's
# Top 10 and JustWatch's most popular, for Canada) every 3 hours, then extras.json (X-Ray's trailers,
# recaps, promos and interviews from YouTube; each title re-searched about weekly, 25 a run) and
# recaps.json (one season or series recap for every Series favourite, weekly) and similar.json
# (X-Ray's More like this for every Series favourite, weekly). Free on a public repository.
# GitHub drops many scheduled runs when it's busy, so it tries every 30 minutes and each try
# stops straight away unless the guide is nearly 3 hours old.
name: guide

on:
  push:
    # Only main: on the working branch it would commit its output there too.
    branches: [main]
    paths:
      - 'guide/channels.json'
      - 'tools/build-guide.mjs'
      - 'tools/build-top10.mjs'
      - 'tools/build-extras.mjs'
      - 'tools/extras-pick.mjs'
      - 'tools/build-recaps.mjs'
      - 'tools/recaps-pick.mjs'
      - 'tools/build-similar.mjs'
      - '.github/workflows/guide.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Is the guide fresh enough already?
        id: fresh
        run: |
          age=$(node -e "const d=require('./guide.json'); console.log(Math.round((Date.now()/1000-d.updated)/60))" 2>/dev/null || echo 9999)
          echo "Guide is $age minutes old."
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$age" -lt 165 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          node-version: 22
      - run: node tools/build-guide.mjs
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
      - run: node tools/build-feeds.mjs
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
      - run: npm ci --omit=dev
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
      - run: node tools/build-movies.mjs
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
      - run: node tools/build-charts.mjs
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
      - run: node tools/build-shows.mjs
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
      - run: node tools/build-top10.mjs
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
      - run: node tools/build-extras.mjs
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
      - run: node tools/build-recaps.mjs
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
      - run: node tools/build-similar.mjs
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
      - name: Save the new guide
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "multigrid-guide"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.json feeds.json
          for file in movies.json charts.json shows.json top10.json extras.json recaps.json similar.json; do if [ -f "$file" ]; then git add "$file"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "Update TV guide, feeds, movies, charts, premieres, Top 10s, X-Ray extras, recaps and similar shows"
          git pull --rebase
          git push
