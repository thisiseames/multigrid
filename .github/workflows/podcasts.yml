# Refreshes podcast-charts.json: Apple's Top Shows and Trending Episodes for Canada.
# Apple's chart feed has no CORS header, so the browser cannot read it directly. This job
# caches it hourly; trending episodes are resolved to full audio for the existing dock.
# Free on a public repository; no key or account.
name: podcasts

on:
  push:
    paths:
      - 'tools/build-podcast-charts.mjs'
      - '.github/workflows/podcasts.yml'
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcasts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-podcast-charts.mjs
      - name: Save the new podcast charts
        run: |
          git config user.name "multigrid-podcasts"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcast-charts.json
          git diff --cached --quiet && exit 0
          git commit -m "Update podcast charts"
          git pull --rebase
          git push
